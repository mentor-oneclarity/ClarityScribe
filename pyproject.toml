[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative ruleset: pyflakes (correctness) + a pycodestyle subset.
# Intentionally not enabling stricter style rules (import sorting, docstrings,
# etc.) until the codebase has had a dedicated formatting pass.
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # line length is handled by black, not worth double-enforcing
]
